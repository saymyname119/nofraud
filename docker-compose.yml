services:
  aegispay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegispay-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:///./aegispay.db
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_MOCK}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-MOCK}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-dummy_secret_for_local_dev}
    volumes:
      # Persist SQLite database and any local audit files
      - aegispay-data:/app/data

volumes:
  aegispay-data:
